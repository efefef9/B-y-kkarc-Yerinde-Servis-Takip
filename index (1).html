<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Büyükkarcı Yerinde Servis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F4F3EF;
    color: #1F1E1B;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  header { margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .logo-badge { height: 34px; flex-shrink: 0; }
  header h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  header p { font-size: 13px; color: #6B6A63; margin-top: 4px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 18px;
  }
  .dropzone {
    flex: 1; min-width: 220px;
    border: 1.5px dashed #C9C6BC;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #6B6A63;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: #FBFAF7;
  }
  .dropzone.drag { border-color: #1D9E75; background: #EAF6F0; color: #0F6E56; }
  .dropzone input { display: none; }
  .dropzone b { color: #1F1E1B; font-weight: 600; }

  .search {
    flex: 1; min-width: 180px;
    height: 38px;
    border: 1px solid #D9D6CC;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 14px;
    background: #fff;
  }
  .search:focus { outline: none; border-color: #888579; }

  select.ilce-filter {
    height: 38px;
    border: 1px solid #D9D6CC;
    border-radius: 8px;
    padding: 0 10px;
    font-size: 14px;
    background: #fff;
    color: #1F1E1B;
  }

  .btn {
    height: 38px;
    border: 1px solid #D9D6CC;
    background: #fff;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
    color: #1F1E1B;
    white-space: nowrap;
  }
  .btn:hover { background: #F0EEE7; }
  .btn.danger { color: #993556; border-color: #E3B9C7; }
  .btn.danger:hover { background: #FBEAF0; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    background: #fff;
    border: 1px solid #E5E3DA;
    border-radius: 10px;
    padding: 11px 14px;
    position: relative;
  }
  .stat .n { font-size: 21px; font-weight: 600; }
  .stat .n .pct { font-size: 13px; font-weight: 500; color: #9A988F; }
  .stat .l { font-size: 12px; color: #6B6A63; margin-top: 2px; }
  .stat.dot { padding-left: 26px; }
  .stat.dot .pip { position: absolute; left: 13px; top: 15px; width: 8px; height: 8px; border-radius: 50%; }

  .map-card {
    background: #fff; border: 1px solid #E5E3DA; border-radius: 10px;
    padding: 16px; margin-bottom: 18px;
  }
  .map-card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  #leafletMap { width: 100%; height: 420px; border-radius: 8px; background: #EFEDE6; }
  .leaflet-pin {
    border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-family: inherit;
  }
  .leaflet-popup-content .gm-info-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .leaflet-popup-content .gm-info-count { font-size: 12px; color: #6B6A63; }

  .table-scroll { overflow-x: auto; border-radius: 10px; border: 1px solid #E5E3DA; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  thead th {
    text-align: left; font-size: 12px; color: #6B6A63; font-weight: 600;
    padding: 9px 12px; border-bottom: 1px solid #E5E3DA; background: #FAF9F6;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: #1F1E1B; }
  thead th .arrow { font-size: 10px; margin-left: 4px; opacity: .5; }
  tbody td { padding: 9px 12px; font-size: 13.5px; border-bottom: 1px solid #EFEDE6; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAF9F6; }
  td.plaka { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .badge {
    display: inline-block; font-size: 12px; font-weight: 500;
    padding: 3px 10px; border-radius: 100px; white-space: nowrap;
  }
  .badge-akhisar { background: #FAEEDA; color: #633806; }
  .badge-yunusemre { background: #E1F5EE; color: #085041; }
  .badge-sehzadeler { background: #E1F5EE; color: #085041; }
  .badge-turgutlu { background: #FAECE7; color: #712B13; }
  .badge-merkez { background: #E1F5EE; color: #085041; }
  .badge-salihli { background: #EEEDFE; color: #26215C; }
  .badge-other { background: #F1EFE8; color: #444441; }

  select.status-select {
    border: none; border-radius: 100px; font-size: 12px; font-weight: 500;
    padding: 4px 22px 4px 10px; cursor: pointer; appearance: none;
    background-repeat: no-repeat; background-position: right 6px center; background-size: 9px;
  }
  .status-bekliyor { background-color: #F1EFE8; color: #6B6A63; }
  .status-serviste { background-color: #FCEFD6; color: #8A5A0C; }
  .status-tamamlandi { background-color: #DCF1E6; color: #166942; }

  .pagination {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-top: 1px solid #E5E3DA; background: #FAF9F6;
    font-size: 12.5px; color: #6B6A63; flex-wrap: wrap;
  }
  .pagination .pg-btns { display: flex; gap: 6px; }
  .pagination button {
    border: 1px solid #D9D6CC; background: #fff; border-radius: 7px;
    padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: #1F1E1B;
  }
  .pagination button:hover:not(:disabled) { background: #F0EEE7; }
  .pagination button:disabled { opacity: .4; cursor: default; }

  .editable-cell { cursor: text; min-width: 60px; }
  .editable-cell:hover { background: #F0EEE7; }
  .editable-cell:empty::before { content: attr(data-placeholder); color: #B0AEA4; }

  .del-btn {
    background: none; border: none; cursor: pointer; color: #A9A79D;
    font-size: 15px; padding: 2px 6px; border-radius: 6px;
  }
  .del-btn:hover { color: #993556; background: #FBEAF0; }

  .empty { text-align: center; padding: 50px 20px; color: #6B6A63; font-size: 14px; }
  .empty b { display: block; font-size: 16px; color: #1F1E1B; margin-bottom: 6px; font-weight: 600; }

  .add-row {
    display: flex; gap: 8px; padding: 12px; background: #FAF9F6; border-top: 1px solid #E5E3DA; flex-wrap: wrap;
  }
  .add-row input {
    flex: 1; min-width: 100px; height: 34px; border: 1px solid #D9D6CC; border-radius: 7px; padding: 0 10px; font-size: 13px;
  }

  footer { margin-top: 16px; font-size: 12px; color: #9A988F; text-align: center; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1F1E1B; color: #fff; font-size: 13px; padding: 8px 16px;
    border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .mode-bar {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 14px;
  }
  .mode-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 100px; font-weight: 500;
    display: flex; align-items: center; gap: 5px;
  }
  .mode-pill.view { background: #F1EFE8; color: #6B6A63; }
  .mode-pill.edit { background: #DCF1E6; color: #166942; }
  .lock-btn {
    border: 1px solid #D9D6CC; background: #fff; border-radius: 8px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; color: #6B6A63;
  }
  .lock-btn:hover { background: #F0EEE7; }
  .edit-only { display: none; }
  body.edit-mode .edit-only { display: revert; }
  body.edit-mode .toolbar .edit-only { display: flex; }
  body.edit-mode select.status-select { pointer-events: auto; }
  body:not(.edit-mode) select.status-select { pointer-events: none; background-image: none !important; appearance: none; }
  body:not(.edit-mode) .editable-cell { cursor: default; pointer-events: none; }
  body:not(.edit-mode) .editable-cell:hover { background: transparent; }

  .pin-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .pin-modal {
    background: #fff; border-radius: 12px; padding: 22px; width: 280px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .pin-modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .pin-modal input {
    width: 100%; height: 38px; border: 1px solid #D9D6CC; border-radius: 8px;
    padding: 0 12px; font-size: 14px; margin-bottom: 10px;
  }
  .pin-modal .pin-actions { display: flex; gap: 8px; }
  .pin-modal .pin-actions button {
    flex: 1; height: 36px; border-radius: 8px; border: 1px solid #D9D6CC;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .pin-modal .pin-actions button.primary { background: #1F1E1B; color: #fff; border-color: #1F1E1B; }
  .pin-error { font-size: 12px; color: #993556; margin-bottom: 8px; min-height: 14px; }
  @media (max-width: 600px) {
    body { padding: 18px 10px 50px; }
    header h1 { font-size: 18px; }
    .logo-badge { height: 26px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar > * { width: 100%; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    #leafletMap { height: 280px; }
    thead th, tbody td { padding: 8px 8px; font-size: 12.5px; }
    .pagination { flex-direction: column; align-items: stretch; text-align: center; }
  }
</style>
</head>

    const mapped = parsed.data.map(mapRow).filter(r => r.plaka);
    rows = mapped;
    pill.textContent = '📊 Google Sheets ile senkron · ' + new Date().toLocaleTimeString('tr-TR');
    showToast(`${mapped.length} kayıt yüklendi`);
  } catch (e) {
    const msg = (e && e.message) ? e.message : 'bilinmeyen hata';
    pill.textContent = '⚠️ Sheets okunamadı';
    showToast('⚠️ ' + msg);
    console.error('Sheets fetch hatası:', e);
  }
  render();
}

document.getElementById('refreshSheetBtn').addEventListener('click', loadFromSheet);

const searchInput = document.getElementById('searchInput');
const ilceFilter = document.getElementById('ilceFilter');
const summary = document.getElementById('summary');
const tableContainer = document.getElementById('tableContainer');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function normalizeKey(k) {
  return k.toString().trim()
    .replace(/İ/g,'i').replace(/I/g,'i')
    .toLowerCase()
    .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/\u0307/g, '');
}

function mapRow(obj) {
  const out = { plaka: '', ilce: '', sofor: '', durum: 'bekliyor' };
  for (const k in obj) {
    const nk = normalizeKey(k);
    if (nk.includes('plaka')) out.plaka = String(obj[k] || '').trim();
    else if (nk.includes('ilce') || nk.includes('district') || nk.includes('santiye') || nk.includes('saha') || nk.includes('bolge')) out.ilce = String(obj[k] || '').trim();
    else if (nk.includes('sofor') || nk.includes('surucu') || nk.includes('driver') || nk.includes('gorevli') || nk.includes('personel')) out.sofor = String(obj[k] || '').trim();
    else if (nk.includes('durum') || nk.includes('status')) {
      const dv = normalizeKey(obj[k] || '');
      if (dv.includes('tamamlandi') || dv.includes('bitti')) out.durum = 'tamamlandi';
      else if (dv.includes('serviste') || dv.includes('devam')) out.durum = 'serviste';
      else out.durum = 'bekliyor';
    }
  }
  return out;
}

function badgeClass(ilce) {
  const n = normalizeKey(ilce || '');
  if (n.includes('akhisar')) return 'badge-akhisar';
  if (n.includes('yunusemre')) return 'badge-yunusemre';
  if (n.includes('sehzadeler')) return 'badge-sehzadeler';
  if (n.includes('turgutlu')) return 'badge-turgutlu';
  if (n.includes('merkez')) return 'badge-merkez';
  if (n.includes('salihli')) return 'badge-salihli';
  return 'badge-other';
}

function dotColor(ilce) {
  const n = normalizeKey(ilce || '');
  if (n.includes('akhisar')) return '#EF9F27';
  if (n.includes('yunusemre') || n.includes('sehzadeler') || n.includes('merkez')) return '#1D9E75';
  if (n.includes('turgutlu')) return '#D85A30';
  if (n.includes('salihli')) return '#7F77DD';
  return '#888780';
}

// Manisa ilçelerinin gerçek enlem/boylam koordinatları
const ILCE_KOORDINAT = {
  'merkez':     { lat: 38.6140337, lng: 27.4295624, label: 'Merkez (Yunusemre/Şehzadeler)' },
  'yunusemre':  { lat: 38.6140337, lng: 27.4295624, label: 'Yunusemre' },
  'sehzadeler': { lat: 38.6140337, lng: 27.4295624, label: 'Şehzadeler' },
  'akhisar':    { lat: 38.9203616, lng: 27.8330282, label: 'Akhisar' },
  'salihli':    { lat: 38.4870740, lng: 28.1380520, label: 'Salihli' },
  'turgutlu':   { lat: 38.5001610, lng: 27.7084100, label: 'Turgutlu' },
  'alasehir':   { lat: 38.3544211, lng: 28.5162540, label: 'Alaşehir' },
  'soma':       { lat: 39.1815909, lng: 27.6052478, label: 'Soma' },
  'kirkagac':   { lat: 39.1094582, lng: 27.6803965, label: 'Kırkağaç' },
  'gordes':     { lat: 38.9349028, lng: 28.2886369, label: 'Gördes' },
  'kula':       { lat: 38.5466602, lng: 28.6534971, label: 'Kula' },
  'demirci':    { lat: 39.0453910, lng: 28.6562061, label: 'Demirci' },
  'golmarmara': { lat: 38.7139130, lng: 27.9184260, label: 'Gölmarmara' },
  'saruhanli':  { lat: 38.7349820, lng: 27.5698180, label: 'Saruhanlı' },
  'sarigol':    { lat: 38.2383510, lng: 28.6964340, label: 'Sarıgöl' },
  'koprubasi':  { lat: 38.7486934, lng: 28.4044895, label: 'Köprübaşı' },
  'selendi':    { lat: 38.7439880, lng: 28.8673670, label: 'Selendi' },
};

function findIlceCoord(ilceName) {
  const n = normalizeKey(ilceName || '');
  for (const key in ILCE_KOORDINAT) {
    if (n.includes(key)) return ILCE_KOORDINAT[key];
  }
  return null;
}

let lmap = null;
let lmarkers = [];
let lmarkerByLabel = {};

function initLeafletMap() {
  lmap = L.map('leafletMap', { scrollWheelZoom: false }).setView([38.75, 28.0], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18,
  }).addTo(lmap);
  renderMap();
}

function renderMap() {
  if (!lmap) return;

  lmarkers.forEach(m => lmap.removeLayer(m));
  lmarkers = [];
  lmarkerByLabel = {};

  if (!rows.length) return;

  const byIlce = {};
  rows.forEach(r => {
    const coord = findIlceCoord(r.ilce);
    if (coord) {
      const key = coord.label;
      byIlce[key] = byIlce[key] || { coord, count: 0 };
      byIlce[key].count++;
    }
  });

  Object.keys(byIlce).forEach(key => {
    const { coord, count } = byIlce[key];
    const color = dotColor(coord.label);
    const size = 28 + Math.min(count, 40) * 0.8;

    const icon = L.divIcon({
      className: 'leaflet-pin',
      html: `<div class="leaflet-pin" style="width:${size}px;height:${size}px;background:${color};font-size:13px;">${count}</div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
    });

    const marker = L.marker([coord.lat, coord.lng], { icon }).addTo(lmap);
    marker.bindPopup(`<div class="gm-info-title">${coord.label}</div><div class="gm-info-count">${count} kamyon</div>`);
    marker.on('click', () => {
      const matchedIlceValue = findRawIlceValueForLabel(coord.label);
      if (matchedIlceValue && ilceFilter.value !== matchedIlceValue) {
        ilceFilter.value = matchedIlceValue;
        render();
      }
    });
    lmarkers.push(marker);
    lmarkerByLabel[key] = { marker, coord };
  });

  focusMapOnSelectedIlce();
}

function findRawIlceValueForLabel(label) {
  const match = rows.find(r => {
    const coord = findIlceCoord(r.ilce);
    return coord && coord.label === label;
  });
  return match ? match.ilce : null;
}

function focusMapOnSelectedIlce() {
  if (!lmap) return;
  const selected = ilceFilter.value;
  if (!selected) {
    if (lmarkers.length > 1) {
      const group = L.featureGroup(lmarkers);
      lmap.fitBounds(group.getBounds().pad(0.3));
    } else if (lmarkers.length === 1) {
      lmap.setView(lmarkers[0].getLatLng(), 11);
    } else {
      lmap.setView([38.75, 28.0], 9);
    }
    return;
  }
  const coord = findIlceCoord(selected);
  if (!coord) return;
  lmap.setView([coord.lat, coord.lng], 12, { animate: true });
  const entry = lmarkerByLabel[coord.label];
  if (entry) entry.marker.openPopup();
}

searchInput.addEventListener('input', () => { currentPage = 1; render(); });
ilceFilter.addEventListener('change', () => { currentPage = 1; render(); });

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!rows.length) return;
  const csv = Papa.unparse(rows.map(r => ({ plaka: r.plaka, ilce: r.ilce, sofor: r.sofor, durum: r.durum })));
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'manisa_servis_filo.csv'; a.click();
  URL.revokeObjectURL(url);
});

function updateIlceFilterOptions() {
  const current = ilceFilter.value;
  const ilceler = [...new Set(rows.map(r => r.ilce).filter(Boolean))].sort();
  ilceFilter.innerHTML = '<option value="">Tüm ilçeler</option>' + ilceler.map(i => `<option value="${i}">${i}</option>`).join('');
  if (ilceler.includes(current)) ilceFilter.value = current;
}

function getFiltered() {
  const q = searchInput.value.trim().toLowerCase();
  const ilce = ilceFilter.value;
  let out = rows.filter(r => {
    if (ilce && r.ilce !== ilce) return false;
    if (q && !(r.plaka.toLowerCase().includes(q) || (r.sofor||'').toLowerCase().includes(q))) return false;
    return true;
  });
  if (sortKey) {
    out = out.slice().sort((a, b) => {
      const av = (a[sortKey] || '').toLowerCase();
      const bv = (b[sortKey] || '').toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }
  return out;
}

function renderSummary() {
  const total = rows.length;
  const byIlce = {};
  rows.forEach(r => { const k = r.ilce || 'Belirsiz'; byIlce[k] = (byIlce[k] || 0) + 1; });
  let html = `<div class="stat"><div class="n">${total}</div><div class="l">Toplam kamyon</div></div>`;
  Object.keys(byIlce).sort().forEach(ilce => {
    const pct = total ? Math.round((byIlce[ilce] / total) * 100) : 0;
    html += `<div class="stat dot"><span class="pip" style="background:${dotColor(ilce)}"></span><div class="n">${byIlce[ilce]} <span class="pct">%${pct}</span></div><div class="l">${ilce}</div></div>`;
  });
  summary.innerHTML = html;
}

function sortIndicator(key) {
  if (sortKey !== key) return '';
  return `<span class="arrow">${sortDir === 1 ? '▲' : '▼'}</span>`;
}

function render() {
  updateIlceFilterOptions();
  renderSummary();
  renderMap();
  const data = getFiltered();

  if (!rows.length) {
    tableContainer.innerHTML = `<div class="table-scroll"><div class="empty"><b>Henüz kayıt yok</b>Excel/CSV listenizi yukarıdan yükleyin.</div></div>`;
    return;
  }

  if (!data.length) {
    tableContainer.innerHTML = `<div class="table-scroll"><div class="empty"><b>Sonuç bulunamadı</b>Arama veya filtre kriterlerinizi değiştirin.</div></div>`;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageData = data.slice(startIdx, startIdx + PAGE_SIZE);

  let html = `<div class="table-scroll"><table><thead><tr>
    <th data-key="plaka">Plaka${sortIndicator('plaka')}</th>
    <th data-key="ilce">İlçe${sortIndicator('ilce')}</th>
    <th data-key="sofor">Şoför${sortIndicator('sofor')}</th>
    <th>Durum</th>
  </tr></thead><tbody>`;

  pageData.forEach((r) => {
    const realIdx = rows.indexOf(r);
    html += `<tr>
      <td class="plaka">${r.plaka}</td>
      <td><span class="badge ${badgeClass(r.ilce)}">${r.ilce || ''}</span></td>
      <td>${r.sofor || ''}</td>
      <td>
        <select class="status-select status-${r.durum}" data-idx="${realIdx}">
          <option value="bekliyor" ${r.durum === 'bekliyor' ? 'selected' : ''}>Bekliyor</option>
          <option value="serviste" ${r.durum === 'serviste' ? 'selected' : ''}>Serviste</option>
          <option value="tamamlandi" ${r.durum === 'tamamlandi' ? 'selected' : ''}>Tamamlandı</option>
        </select>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;

  html += `<div class="pagination">
    <span>${data.length} kayıttan ${startIdx + 1}-${Math.min(startIdx + PAGE_SIZE, data.length)} arası gösteriliyor</span>
    <div class="pg-btns">
      <button id="pgPrev" ${currentPage <= 1 ? 'disabled' : ''}>‹ Önceki</button>
      <span style="align-self:center;padding:0 6px;">Sayfa ${currentPage} / ${totalPages}</span>
      <button id="pgNext" ${currentPage >= totalPages ? 'disabled' : ''}>Sonraki ›</button>
    </div>
  </div></div>`;

  tableContainer.innerHTML = html;

  const pgPrev = document.getElementById('pgPrev');
  const pgNext = document.getElementById('pgNext');
  if (pgPrev) pgPrev.addEventListener('click', () => { currentPage--; render(); });
  if (pgNext) pgNext.addEventListener('click', () => { currentPage++; render(); });

  tableContainer.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      currentPage = 1;
      render();
    });
  });

  tableContainer.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const idx = +sel.dataset.idx;
      rows[idx].durum = sel.value;
      render();
    });
  });
}

loadFromSheet();
initLeafletMap();
setInterval(loadFromSheet, 60000);
</script>
